[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zyre-proxy-scraper"
version = "3.0.0"
description = "Async scraper and checker for free HTTP, SOCKS4, and SOCKS5 proxies. 250+ live sources, multi-judge validation, anonymity + geo tagging, JSON/CSV/TXT export."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    { name = "zyrexdz" }
]
keywords = ["proxy", "scraper", "checker", "http", "socks4", "socks5", "asyncio", "aiohttp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Utilities",
]
dependencies = [
    "aiohttp>=3.9.0",
    "aiohttp-socks>=0.8.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "mypy>=1.7",
    "ruff>=0.1",
]
geo = [
    "maxminddb>=2.0",
]
all = [
    "zyre-proxy-scraper[dev,geo]",
]

[project.scripts]
zyre-proxy-scraper = "proxy_scraper.cli:main"
proxy-scraper-checker = "proxy_scraper.cli:main"

[project.urls]
Homepage = "https://github.com/zyrexdz/proxy-scraper-checker"
Issues = "https://github.com/zyrexdz/proxy-scraper-checker/issues"
Changelog = "https://github.com/zyrexdz/proxy-scraper-checker/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["proxy_scraper*"]

[tool.setuptools.package-data]
proxy_scraper = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.9"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
